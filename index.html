
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emmet 2.0</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, #102333, #020509 75%);
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

h1 {
  color: #00eaff;
  letter-spacing: 7px;
  text-shadow: 0 0 18px #00eaff;
}

#robot {
  width: 310px;
  height: 310px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid #00eaff;
  border-radius: 50%;
  background: radial-gradient(circle, #172d40, #03070c 75%);
  box-shadow: 0 0 30px #00eaff, inset 0 0 35px #006b99;
  animation: float 3s ease-in-out infinite;
}

.face {
  width: 220px;
  height: 130px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 35px;
  z-index: 4;
}

.eye {
  width: 65px;
  height: 45px;
  position: relative;
  flex: 0 0 65px;
  border-radius: 8px 8px 30px 30px;
  background: #00eaff;
  box-shadow: 0 0 18px #00eaff, 0 0 35px #00aaff;
  animation: blink 5s infinite;
}

/* OJOS SIN PUPILAS: ningún elemento interior */

.eye::before,
.eye::after {
  content: none !important;
  display: none !important;
}

.mouth {
  position: absolute;
  bottom: 0;
  width: 45px;
  height: 6px;
  border-radius: 20px;
  background: #00eaff;
  box-shadow: 0 0 12px #00eaff;
}

/* CONFUSIÓN */

.skin-confusion {
  border-color: #ffd43b !important;
  box-shadow: 0 0 35px #ffd43b, inset 0 0 35px #665000 !important;
}

.skin-confusion .eye {
  background: #ffd43b;
  box-shadow: 0 0 20px #ffd43b;
}

.skin-confusion .left-eye { transform: rotate(-17deg); }
.skin-confusion .right-eye { transform: rotate(17deg); }

.skin-confusion .mouth {
  width: 23px;
  height: 23px;
  border: 5px solid #ffd43b;
  background: transparent;
  border-radius: 50%;
}

/* ASTRONOMÍA: AGUJERO NEGRO Y DISCO DE ACRECIÓN */

.black-hole {
  position: absolute;
  width: 100px;
  height: 100px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: #000;
  z-index: 6;
  box-shadow: 0 0 15px #000, 0 0 35px #a64dff;
}

.accretion {
  position: absolute;
  width: 245px;
  height: 90px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) rotate(-20deg);
  border-radius: 50%;
  border: 9px solid transparent;
  background:
    linear-gradient(#000, #000) padding-box,
    linear-gradient(90deg, #ff3d00, #ffdc62, #fff, #a64dff, #ff3d00) border-box;
  box-shadow:
    0 0 12px #ff9d36,
    0 0 25px #a64dff,
    0 0 40px #6120ff;
  z-index: 5;
  animation: diskGlow 2s ease-in-out infinite alternate;
}

.accretion::before {
  content: "";
  position: absolute;
  inset: 8px -10px;
  border: 3px solid #ffb13b;
  border-radius: 50%;
  filter: blur(4px);
}

.accretion::after {
  content: "";
  position: absolute;
  inset: -18px -28px;
  border: 2px solid #8d36ff;
  border-radius: 50%;
  opacity: .8;
}

.skin-astronomy {
  border-color: #a64dff !important;
  box-shadow: 0 0 40px #8d36ff, inset 0 0 35px #300050 !important;
}

.skin-astronomy .eye,
.skin-astronomy .mouth {
  display: none;
}

/* ÉPICO: RAYOS QUE NACEN DE LOS OJOS */

.skin-epic {
  border-color: #00fff0 !important;
  box-shadow: 0 0 45px #00fff0, inset 0 0 35px #005e65 !important;
}

.skin-epic .eye {
  background: #fff;
  box-shadow: 0 0 20px #fff, 0 0 45px #00eaff;
  animation: epicGlow .6s infinite alternate;
  overflow: visible;
}

/* Cada rayo sale desde el borde inferior del ojo */
.skin-epic .eye::after {
  content: "";
  display: block !important;
  position: absolute;
  top: 32px;
  left: 50%;
  width: 24px;
  height: 115px;
  transform: translateX(-50%);
  background: linear-gradient(
    to bottom,
    #ffffff 0%,
    #00ffff 35%,
    #008cff 70%,
    transparent 100%
  );
  clip-path: polygon(
    40% 0, 100% 20%, 58% 35%,
    90% 52%, 35% 65%, 65% 82%,
    0 100%, 28% 58%, 5% 35%
  );
  filter: drop-shadow(0 0 8px #00ffff);
  animation: lightningFlash .18s infinite alternate;
}

.skin-epic .mouth {
  background: #00fff0;
  box-shadow: 0 0 20px #00fff0;
}

/* QUINTO TRAJE */

.skin-energy {
  border-color: #438aff !important;
  box-shadow: 0 0 40px #438aff, inset 0 0 35px #102c88 !important;
}

.skin-energy .eye {
  background: #8bdcff;
  box-shadow: 0 0 20px #8bdcff, 0 0 40px #246cff;
  animation: energyPulse 1.2s infinite alternate;
}

.skin-energy .mouth {
  background: #438aff;
  box-shadow: 0 0 20px #438aff;
}

.energy-ring {
  position: absolute;
  width: 275px;
  height: 275px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border: 2px dashed #438aff;
  border-radius: 50%;
  animation: ringSpin 8s linear infinite;
}

/* ANIMACIONES */

@keyframes float {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -10px; }
}

@keyframes blink {
  0%, 45%, 50%, 100% { scale: 1 1; }
  47%, 49% { scale: 1 .08; }
}

@keyframes diskGlow {
  from { filter: brightness(.8); }
  to { filter: brightness(1.5); }
}

@keyframes epicGlow {
  from { box-shadow: 0 0 15px #fff, 0 0 30px #00eaff; }
  to { box-shadow: 0 0 35px #fff, 0 0 65px #00eaff; }
}

@keyframes lightningFlash {
  from { opacity: .55; }
  to { opacity: 1; }
}

@keyframes energyPulse {
  from { filter: brightness(.8); }
  to { filter: brightness(1.8); }
}

@keyframes ringSpin {
  to { rotate: 360deg; }
}

button {
  margin-top: 25px;
  padding: 13px 28px;
  border: 2px solid #00eaff;
  border-radius: 30px;
  background: #071923;
  color: #00eaff;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 0 15px #00eaff;
}

#costumeName {
  margin-top: 24px;
  color: #00eaff;
  letter-spacing: 3px;
  font-size: 20px;
}

#counter {
  margin-top: 12px;
  color: #91aab8;
}
</style>
</head>

<body>
<h1>EMMET 2.0</h1>

<div id="robot">
  <div class="energy-ring" id="energyRing" hidden></div>
  <div class="accretion" id="accretion" hidden></div>
  <div class="black-hole" id="blackHole" hidden></div>

  <div class="face">
    <div class="eye left-eye"></div>
    <div class="eye right-eye"></div>
    <div class="mouth"></div>
  </div>
</div>

<div id="costumeName">ORIGINAL</div>
<button id="nextCostume">SIGUIENTE DISFRAZ</button>
<div id="counter">1 / 5</div>

<script>
const robot = document.getElementById("robot");
const costumeName = document.getElementById("costumeName");
const counter = document.getElementById("counter");
const blackHole = document.getElementById("blackHole");
const accretion = document.getElementById("accretion");
const energyRing = document.getElementById("energyRing");

const costumes = [
  { name: "ORIGINAL", className: "" },
  { name: "CONFUSIÓN", className: "skin-confusion" },
  { name: "ASTRONOMÍA", className: "skin-astronomy" },
  { name: "ÉPICO", className: "skin-epic" },
  { name: "ENERGÍA", className: "skin-energy" }
];

let currentCostume = 0;

function changeCostume() {
  currentCostume = (currentCostume + 1) % costumes.length;
  const costume = costumes[currentCostume];

  robot.className = "";
  if (costume.className) {
    robot.classList.add(costume.className);
  }

  blackHole.hidden = currentCostume !== 2;
  accretion.hidden = currentCostume !== 2;
  energyRing.hidden = currentCostume !== 4;

  costumeName.textContent = costume.name;
  counter.textContent = `${currentCostume + 1} / 5`;
}

document.getElementById("nextCostume")
  .addEventListener("click", changeCostume);
</script>
</body>
</html>
